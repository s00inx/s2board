<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>s2board</title>
    <style>
        body { 
            font-family: monospace; max-width: 800px; margin: 0 auto; padding: 20px; 
            background: #fff; color: #000; line-height: 1.4; 
        }
        h1, h2, h3 { text-transform: uppercase; border-bottom: 1px solid #000; padding-bottom: 5px; }
        .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; background: #fff; position: relative; }
        .gray { background: #f5f5f5; border: 1px solid #ddd; }
        
        #peers-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 12px; }
        .peer-item { border-left: 3px solid #000; padding-left: 10px; margin-bottom: 5px; }

        .form-group { margin-bottom: 10px; }
        input[type="text"], textarea { 
            width: 100%; padding: 8px; border: 1px solid #ccc; font-family: inherit; box-sizing: border-box; 
        }
        input[type="file"] { font-size: 12px; margin-top: 5px; }
        
        button { 
            background: #000; color: #fff; border: 1px solid #000; padding: 10px 20px; 
            cursor: pointer; font-family: inherit; text-transform: uppercase; width: 100%;
        }
        button:hover { background: #fff; color: #000; }
        button:disabled { background: #ccc; border-color: #ccc; cursor: not-allowed; }
        
        .btn-del { 
            background: #fff; color: #000; border: 1px solid #ccc; width: auto; 
            padding: 3px 8px; font-size: 10px; margin-top: 10px; cursor: pointer;
        }
        .btn-del:hover { border-color: #000; background: #000; color: #fff; }

        .meta { font-size: 11px; color: #666; margin-top: 10px; border-top: 1px dashed #ccc; padding-top: 10px; }
        #feed { margin-top: 20px; }
        a { color: #000; text-decoration: underline; font-weight: bold; }
        .no-file { color: #999; font-size: 11px; text-transform: uppercase; }
        .author-badge { font-size: 9px; background: #000; color: #fff; padding: 2px 4px; text-transform: uppercase; margin-left: 5px; }
    </style>
</head>
<body>

<h1>/s2board</h1>

<div class="card gray">
    <h3>Узлы в сети</h3>
    <div id="peers-list">Загрузка...</div>
</div>

<div class="card">
    <h3>Создать пост</h3>
    <form id="uploadForm">
        <div class="form-group"><input type="text" id="title" placeholder="заголовок записи" required></div>
        <div class="form-group"><textarea id="desc" placeholder="описание файла или заметка..." rows="3"></textarea></div>
        <div style="display: flex; gap: 10px; margin-bottom: 10px; align-items: center;">
            <input type="text" id="author-name" placeholder="погоняло (по умолчанию - имя ноды)" style="flex: 1;">
            <input type="file" id="file" style="flex: 1;">
        </div>
        <button type="submit" id="submitBtn">Черкануть!</button>
    </form>
</div>

<h2>Лента</h2>
<div id="feed"></div>

<script>
    let myUID = ""; // Сюда сохраним ID нашей ноды

    // Узнаем свой UID у бэкенда
    async function getMe() {
        try {
            const r = await fetch('/api/me');
            const data = await r.json();
            myUID = data.uid;
            console.log("Мой UID:", myUID);
        } catch (e) {
            console.error("Не удалось получить свой UID");
        }
    }

    async function loadPeers() {
        try {
            const r = await fetch('/api/getpeers');
            const peers = await r.json();
            const el = document.getElementById('peers-list');
            
            if (!peers || peers.length === 0) {
                el.innerHTML = "<div>Пиры не найдены. Ты один.</div>";
                return;
            }

            el.innerHTML = peers.map(p => `
                <div class="peer-item">
                    <b>${p.Name || 'Node'}</b><br>
                    <span>${p.IP}:${p.Port}</span>
                </div>
            `).join('');
        } catch (e) {
            document.getElementById('peers-list').innerHTML = "Ошибка API пиров.";
        }
    }

    async function deletePost(hash) {
        if (!confirm("Удалить запись из сети?")) return;
        try {
            const r = await fetch('/api/del', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ hash: hash, author: myUID })
            });
            if (r.ok) loadFeed();
            else alert("Ошибка: возможно, вы не автор этой записи.");
        } catch (e) { console.error("Ошибка удаления"); }
    }

    async function loadFeed() {
        try {
            const r = await fetch('/api/list');
            const data = await r.json();
            const el = document.getElementById('feed');
            
            if (!data || data.length === 0) {
                el.innerHTML = "Лента пуста.";
                return;
            }

            el.innerHTML = data.reverse().map(m => {
                // Проверяем авторство
                const isAuthor = (m.author === myUID);

                return `
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <b style="font-size: 1.2rem;">${m.title}</b>
                        ${m.filehash ? `<a href="/api/dl/${m.filehash}" target="_blank">СКАЧАТЬ</a>` : `<span class="no-file">Без вложения</span>`}
                    </div>
                    <p style="white-space: pre-wrap;">${m.desc || ''}</p>
                    <div class="meta">
                        ОТ: ${m.author_name || 'Аноним'} ${isAuthor ? '<span class="author-badge">Вы</span>' : ''} 
                        ${m.size > 0 ? `| РАЗМЕР: ${(m.size / 1024).toFixed(1)} KB` : ''}<br>
                        HASH: ${m.hash.substring(0,16)}
                    </div>
                    ${isAuthor ? `<button class="btn-del" onclick="deletePost('${m.hash}')">Удалить</button>` : ''}
                </div>
                `;
            }).join('');
        } catch (e) {
            document.getElementById('feed').innerHTML = "Ошибка загрузки ленты.";
        }
    }

    document.getElementById('uploadForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const fileInput = document.getElementById('file');
        
        btn.disabled = true; btn.innerText = "Ожидание...";

        const fd = new FormData();
        if (fileInput.files.length > 0) {
            fd.append('file', fileInput.files[0]);
        }
        
        fd.append('title', document.getElementById('title').value);
        fd.append('desc', document.getElementById('desc').value);
        fd.append('author', document.getElementById('author-name').value);

        try {
            const r = await fetch('/api/create', { method: 'POST', body: fd });
            if (r.ok) {
                document.getElementById('uploadForm').reset();
                loadFeed();
            }
        } catch (e) {
            alert("Ошибка при создании поста");
        } finally {
            btn.disabled = false; btn.innerText = "Черкануть!";
        }
    };

    // Инициализация
    async function start() {
        await getMe();    // Сначала узнаем свой ID
        loadPeers();      // Потом грузим список пиров
        loadFeed();       // И ленту
        
        setInterval(loadPeers, 5000);
        setInterval(loadFeed, 10000);
    }

    start();
</script>
</body>
</html>
